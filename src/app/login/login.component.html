<div id="toast" #toast class="toast"></div>

<div #container class="container">
    <div class="form-box login">
        <form (submit)="onLogin()">
            <h1>Login</h1>
            <div class="input-box">
                <input type="email" [(ngModel)]="email" name="email" placeholder="Email" required />
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input type="password" [(ngModel)]="password" name="password" placeholder="Password" required />
                <i class="bx bxs-lock-alt"></i>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>

    <div class="form-box register">
        <form (submit)="onRegister()">
            <h1>Register</h1>
            <div class="input-box">
                <input type="text" [(ngModel)]="username" name="username" placeholder="Username" required />
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input type="email" [(ngModel)]="registerEmail" name="registerEmail" placeholder="Email" required />
                <i class="bx bxs-envelope"></i>
            </div>
            <div class="input-box">
                <input type="password" [(ngModel)]="registerPassword" name="registerPassword" placeholder="Password"
                    required />
                <i class="bx bxs-lock-alt"></i>
            </div>
            <button type="submit" class="btn">Register</button>
        </form>
    </div>

    <div class="toggle-box">
        <div class="toggle-panel toggle-left">
            <h1>Hello, Welcome!</h1>
            <p>Don't have an account?</p>
            <button #registerBtn class="btn register-btn">Register</button>
        </div>

        <div class="toggle-panel toggle-right">
            <h1>Welcome Back!</h1>
            <p>Already have an account?</p>
            <button #loginBtn class="btn login-btn">Login</button>
        </div>
    </div>
</div>
