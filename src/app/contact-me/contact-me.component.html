<div style="background-color: rgba(169, 169, 169, 0.073);">
    <div class="content">
        <div class="text-center py-4 one">
            <span class="headingOne dark-blue pb-3 d-block">Contact Me</span>
        </div>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-12">
                    <div class="row align-items-center">
                        <div class="col-lg-7 mb-5 mb-lg-0 text-center text-lg-start">
                            <h2 class="mb-4">We’d Love to Hear From You! 👋</h2>
                            <p class="section-text" style="letter-spacing: 1.5px;">
                                Hate forms? Send us an
                                <a href="mailto:swaminathankannank@gmail.com" class="themeColor fw-bold">Email</a>
                                instead!
                            </p>

                            <form (ngSubmit)="onSubmit()">
                                <div class="row">
                                    <div class="col-md-6 form-group mb-3">
                                        <label for="fname">First Name</label>
                                        <input type="text" class="form-control" [(ngModel)]="fname" name="fname" id="fname"
                                            placeholder="Name.." required>
                                    </div>
                                    <div class="col-md-6 form-group mb-3">
                                        <label for="lname">Last Name</label>
                                        <input type="text" class="form-control" [(ngModel)]="lname" name="lname" id="lname"
                                            placeholder="Surname.." required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-12 form-group mb-3">
                                        <label for="email">Email</label>
                                        <input type="email" class="form-control" [(ngModel)]="email" name="email" id="email"
                                            placeholder="Enter your email.." required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-12 form-group mb-3">
                                        <label for="message">Message</label>
                                        <textarea class="form-control" [(ngModel)]="message" name="message" id="message" cols="30" rows="5"
                                            placeholder="Write your message..." required></textarea>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-12 py-3 d-flex justify-content-center">
                                        <button type="submit" class="border-el-btn">
                                            Submit
                                            <span class="b1"></span>
                                            <span class="b2"></span>
                                            <span class="b3"></span>
                                            <span class="b4"></span>
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="col-md-6 col-lg-5 d-flex justify-content-center">
                            <div class="img-about text-center">
                                <img src="/assets/contactMe.png" alt="About Image" class="img-fluid mx-auto d-block">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toast Container (Bottom-Right Position) -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div *ngIf="toastMessage" class="toast show" [ngClass]="toastClass">
        <div class="toast-header">
            <strong class="me-auto">{{ toastTitle }}</strong>
            <button type="button" class="btn-close" (click)="toastMessage = ''"></button>
        </div>
        <div class="toast-body">{{ toastMessage }}</div>
    </div>
</div>
